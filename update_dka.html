      "Instruksi": "Ceritakan bagaimana satuan pendidikan Anda memfasilitasi peningkatan kapasitas kompetensi pendidik dan tenaga kependidikan, melalui penerapan refleksi kinerja; evaluasi kinerja dan penyusunan rencana pengembangan kompetensi pendidik dan tenaga kependidikan.<br><br>Refleksi Kinerja: pendidik dan tenaga kependidikan merenungkan kembali apa yang sudah terjadi dan dilakukan. Tindakan ini dilakukan dengan sadar dan terencana sebagai upaya perbaikan kinerja. Fokus refleksi adalah pada pertanyaan tentang efektivitas pembelajaran yang telah diterapkan untuk memfasilitasi proses belajar murid, dan perlu didasarkan pada bukti-bukti yang relevan. Hal ini dapat berupa bukti-bukti tentang hasil belajar murid (hasil tes dan karya yang dihasilkan). Bukti tersebut juga dapat berupa umpan balik dari murid serta guru lain.<br><br>Evaluasi kinerja: evaluasi tentang kinerja pendidik dan tenaga kependidikan yang diterapkan oleh manajemen satuan pendidikan. Keberadaan evaluasi kinerja yang berlangsung secara terencana di sekolah menjadi indikasi kinerja kepala sekolah dalam memastikan kapasitas pendidik memfasilitasi pembelajaran dengan baik. Evaluasi kinerja pendidik yang efektif mampu memberikan gambaran yang holistik dan akurat tentang berbagai aspek kinerja guru yang mencakup kemampuan mengajar, interaksi dengan siswa, pengembangan kurikulum, dan kontribusi terhadap pengembangan sekolah secara keseluruhan.<br><br> Rencana pengembangan kompetensi pendidik: Rencana berisikan identifikasi kompetensi yang diperlukan oleh pendidik dan tenaga kependidikan untuk meningkatkan kinerja layanan, serta cara untuk mencapainya. Rencana disepakati bersama dengan kepala satuan pendidikan, dan dapat didukung oleh pembiayaan dari satuan pendidikan.<br><br> Dalam membuktikan kinerja, Anda dapat merujuk pada dokumentasi utama yang sudah Anda unggah sebagai rujukan/bukti bahwa hal tersebut sudah terjadi. Misalnya di bagian mana pada RKT atau dokumentasi suasana belajar Anda yang dapat menunjukkan kinerja tersebut.<br><br> Anda juga dapat merujuk pada bukti selain dokumentasi utama saat mendeskripsikan kinerja sekolah Anda. Bukti tersebut dapat Anda identifikasi di kolom Identifikasi Bukti Lain, dan disampaikan kepada asesor saat visitasi.<br><br> Jika belum, silahkan jelaskan rasional mengapa satuan pendidikan Anda belum melakukan hal tersebut.<br><br>",

const mainTitle = document.getElementById("mainTitle");

let currentIndex = 0;

/* LOAD OPTIONS */
function loadOptions(){
  selects.forEach(select=>{
    select.innerHTML = "";
    dataButir.forEach((item,index)=>{
      const option = document.createElement("option");
      option.value = index;
      option.textContent = item.judul;
      select.appendChild(option);
    });
  });
}

/* RENDER CONTENT */
function renderSections(index){
  currentIndex = index;

    // 🔥 UPDATE TITLE
  //mainTitle.textContent =
    //"Komponen 1 : " + dataButir[index].judul;

    // 🔥 UPDATE TITLE
//mainTitle.textContent = dataButir[index].judul;
//mainTitle.textContent =
  //dataButir[index].komponen + " - " + dataButir[index].judul;

  mainTitle.innerHTML = `
  <span class="komponen-text">${dataButir[index].komponen}</span>
  -
  <span class="butir-text">${dataButir[index].judul}</span>
`;

  // sync semua select
  selects.forEach(select=>{
    select.value = index;
  });

  dynamicContent.innerHTML = "";

  const sections = dataButir[index].sections;

  for(const title in sections){
    const sectionWrapper = document.createElement("div");
    sectionWrapper.className = "section";

    const sectionTitle = document.createElement("div");
    sectionTitle.className = "section-title";
    sectionTitle.textContent = title;

    sectionWrapper.appendChild(sectionTitle);

    const content = sections[title];

    if(Array.isArray(content)){
      const ul = document.createElement("ul");
      content.forEach(item => {
  const li = document.createElement("li");

  // 1️⃣ Kalau string biasa
  if (typeof item === "string") {
    li.textContent = item;
  }

  // 2️⃣ Kalau format textBefore + linkText
  //else if (item && typeof item === "object" && item.link) {

    // Text sebelum link
    //if (item.textBefore) {
      //li.appendChild(document.createTextNode(item.textBefore));
    //}

    // Link
    //const a = document.createElement("a");
    //a.href = item.link;
    //a.textContent = item.linkText || "Klik disini";
    //a.target = "_blank";
    //a.rel = "noopener noreferrer";
    //a.style.color = "#35c38f";
    //a.style.textDecoration = "none";

    //li.appendChild(a);

    // Kalau mau bisa tambah textAfter juga nanti
    //if (item.textAfter) {
      //li.appendChild(document.createTextNode(item.textAfter));
    //}
  //}
else if (item && typeof item === "object" && item.link) {

  // Kalau pakai format simple { text, link }
  if (item.text) {
    const a = document.createElement("a");
    a.href = item.link;
    a.textContent = item.text;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.color = "#35c38f";
    a.style.textDecoration = "none";

    li.appendChild(a);
  }

  // Kalau pakai format lengkap
  else {

    if (item.textBefore) {
      li.appendChild(document.createTextNode(item.textBefore));
    }

    const a = document.createElement("a");
    a.href = item.link;
    a.textContent = item.linkText || "Klik disini";
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.color = "#35c38f";
    a.style.textDecoration = "none";

    li.appendChild(a);

    if (item.textAfter) {
      li.appendChild(document.createTextNode(item.textAfter));
    }
  }
}

  ul.appendChild(li);
});
//      content.forEach(item=>{
//        const li = document.createElement("li");
//        li.textContent = item;
//        ul.appendChild(li);
//      });
      sectionWrapper.appendChild(ul);
    }else{
      const p = document.createElement("p");
      p.style.lineHeight = "1.8";
      //p.textContent = content;
      p.innerHTML = content;
      sectionWrapper.appendChild(p);
    }

    dynamicContent.appendChild(sectionWrapper);
  }
}

/* SELECT EVENT */
selects.forEach(select=>{
  select.addEventListener("change", function(){
    renderSections(parseInt(this.value));
  });
});

/* NAV BUTTON EVENTS */
firstBtns.forEach(btn=>{
  btn.onclick = ()=> renderSections(0);
});

prevBtns.forEach(btn=>{
  btn.onclick = ()=>{
    if(currentIndex > 0){
      renderSections(currentIndex - 1);
    }
  };
});

nextBtns.forEach(btn=>{
  btn.onclick = ()=>{
    if(currentIndex < dataButir.length - 1){
      renderSections(currentIndex + 1);
    }
  };
});

lastBtns.forEach(btn=>{
  btn.onclick = ()=>{
    renderSections(dataButir.length - 1);
  };
});

function getButirFromURL(){
  const params = new URLSearchParams(window.location.search);
  const index = params.get("butir");

  if(index !== null){
    return parseInt(index);
  }

  return 0; // default jika tidak ada parameter
}
